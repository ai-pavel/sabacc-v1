name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The 2005 sources use upper-case DOS file names but reference them in
      # lower case; Pages is case-sensitive, so publish a lower-cased copy.
      - name: Build site
        run: |
          mkdir _site
          cd src
          find . -type f ! -name .DS_Store | while read -r f; do
            dest="../_site/$(echo "$f" | tr '[:upper:]' '[:lower:]')"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          cp ../_site/index.htm ../_site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
